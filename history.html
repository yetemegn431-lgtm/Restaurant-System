<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Order History</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.order{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 0 5px gray;
}

h1{
text-align:center;
}

</style>

</head>

<body>

<h1>📜 Order History</h1>

<div id="orders"></div>

<script>

let history = JSON.parse(localStorage.getItem("history")) || [];

let div = document.getElementById("orders");

if(history.length==0){

div.innerHTML="<h2>No Orders Yet!</h2>";

}else{

history.reverse().forEach(order=>{

div.innerHTML += `

<div class="order">

<h3>${order.orderNo}</h3>

<p><b>Name:</b> ${order.name}</p>

<p><b>Phone:</b> ${order.phone}</p>

<p><b>Date:</b> ${order.date}</p>

<p><b>Total:</b> ${order.total} ETB</p>

</div>

`;

});

}

</script>

</body>
</html>
